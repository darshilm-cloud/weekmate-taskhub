  <title>Welcome to Taskhub Portal </title>
  <style>
    /* Branded splash shown until the React bundle parses and mounts. Without it
       the page is blank white for ~1s on cold load and after the post-login
       full-page redirect. React replaces #root's children on mount, so this is
       removed automatically — no JS needed. */
    #app-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0b3a5b;
      z-index: 9999;
    }
    #app-splash .app-splash-logo {
      width: 88px;
      height: auto;
      animation: app-splash-pulse 1.4s ease-in-out infinite;
    }
    #app-splash .app-splash-spinner {
      margin-top: 28px;
      width: 34px;
      height: 34px;
      border: 3px solid rgba(255, 255, 255, 0.25);
      border-top-color: #00bdf2;
      border-radius: 50%;
      animation: app-splash-spin 0.8s linear infinite;
    }
    @keyframes app-splash-spin {
      to { transform: rotate(360deg); }
    }
    @keyframes app-splash-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
  </style>
