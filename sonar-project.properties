# =============================================================================
# SonarQube analysis configuration - WeekMate TaskHub
# =============================================================================
# Run via ./scripts/sonar-scan.sh (never invoke sonar-scanner directly: the
# lcov paths need a rewrite step first - see "Coverage" below).
#
# NO TOKEN IN THIS FILE. The scanner reads it from $SONAR_TOKEN at runtime.
# =============================================================================
sonar.projectKey=weekmate-taskhub
sonar.projectName=WeekMate TaskHub
sonar.projectVersion=0.1.0
sonar.sourceEncoding=UTF-8

# -----------------------------------------------------------------------------
# Sources
# -----------------------------------------------------------------------------
# Listed explicitly rather than "sonar.sources=." so that repo-root artefacts
# (the .xlsx inventory, settings.zip, bitbucket-pipelines.yml) are never indexed.
# "settings" is the real shared-config directory; see the symlink note below.
sonar.sources=client/src,server,socket,settings

# -----------------------------------------------------------------------------
# Tests
# -----------------------------------------------------------------------------
# Tests live beside the code they cover, so sonar.tests points at the same tree
# as sonar.sources and test.inclusions does the classifying. Sonar removes
# anything matching test.inclusions from the main-source set automatically.
#
# setupTests.js is listed explicitly and is NOT an oversight to tidy away: it is
# Jest's setupFilesAfterEnv bootstrap, so Jest never instruments it (it is also
# "!src/setupTests.js" in collectCoverageFrom). Without this line it is indexed
# as ordinary main source with no coverage data, and every line of it counts as
# uncovered - which is exactly what pinned new_coverage at 0.0% once the file
# was edited. Classifying test infrastructure as test code is the correct fix;
# a coverage.exclusion would have hidden it instead.
sonar.tests=client/src
sonar.test.inclusions=client/src/**/*.test.js,client/src/**/*.test.jsx,client/src/**/*.spec.js,client/src/**/*.spec.jsx,client/src/setupTests.js

# -----------------------------------------------------------------------------
# Analysis exclusions - files not indexed at all
# -----------------------------------------------------------------------------
# Each entry states WHY. Do not add a line here to move a metric.
#
#  node_modules      third-party dependencies, not our code
#  client/build      generated webpack output, not source
#  server/uploads    runtime user-upload directory, contents are not source
#  server/public     served static assets
#  */settings/**     SYMLINK DUPLICATES. client/src/settings -> ../../settings and
#                    server/settings -> ../settings both point at the repo-root
#                    "settings" directory (see .gitignore). Indexing them would
#                    register the same physical files two extra times, producing
#                    a guaranteed false 100% duplicated-lines reading on them and
#                    triple-counting their ncloc. The real directory is analysed
#                    exactly once as the "settings" source root above.
sonar.exclusions=\
  **/node_modules/**,\
  client/build/**,\
  server/uploads/**,\
  server/public/**,\
  client/src/settings/**,\
  server/settings/**

# -----------------------------------------------------------------------------
# Coverage exclusions - indexed and rule-checked, but not scored for coverage
# -----------------------------------------------------------------------------
# MUST stay in sync with "collectCoverageFrom" in client/package.json.
# Exactly ONE entry, because coverage there is physically impossible - NOT
# because the code is inconvenient to test:
#
#   client/src/settings/**
#     Jest can never emit coverage for this path: it is a symlink resolving to
#     <repo>/settings, which is OUTSIDE the Jest rootDir (client/). Jest happily
#     resolves modules THROUGH the link - client/src/containers/App/index.js
#     imports ../../settings/socketEventName and that works - but it writes no
#     coverage entries for files outside rootDir. Left scoreable it would sit at
#     0% forever. Also excluded from analysis above as a symlink duplicate; the
#     real directory is analysed once as the "settings" source root.
#
# DELIBERATELY NOT EXCLUDED:
#   client/src/pages/Tasks/index1.js
#     Was excluded while it carried a real SyntaxError (a stray </div> at line
#     1393) that made Babel instrumentation impossible. That line has since been
#     removed and the file now parses and instruments cleanly, so the exclusion
#     no longer has a justification and has been dropped. Including it costs
#     0.02pp of line coverage (+158 executable lines: 28083 -> 28241), which is
#     not a reason to hide it. It is still dead code - nothing under client/src
#     imports it and the live page is index.jsx - so it should be DELETED
#     rather than excluded.
#
#   server/ and socket/
#     They have no test suite yet, so they appear in NO lcov report. Note what
#     that actually means: Sonar computes coverage only for files present in a
#     report, so these files get NO coverage measure at all - they are not
#     scored 0%, they are simply absent from the coverage ratio. Listing them
#     here would therefore change nothing; the fix is a server test suite, and
#     until then their absence is a real gap in what the gate can see.
sonar.coverage.exclusions=client/src/settings/**

# -----------------------------------------------------------------------------
# Coverage report
# -----------------------------------------------------------------------------
# Jest writes lcov paths relative to the package that ran it (client/), e.g.
# "SF:src/NextApp.js", but Sonar resolves them from the project root. The
# scan script regenerates lcov and writes a prefixed copy to lcov.sonar.info
# ("SF:client/src/NextApp.js"). Pointing at the raw lcov.info silently yields
# 0% coverage - the scanner logs "cannot find file" warnings and uploads nothing.
sonar.javascript.lcov.reportPaths=client/coverage/lcov.sonar.info

# Fail the command (non-zero exit) if the quality gate does not pass.
sonar.qualitygate.wait=true
